<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6d5dfc" />
  <title>Taskflow — To-Do App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-title" id="editTitle">Edit task</div>
      <input class="modal-input" id="editInput" type="text" maxlength="120" />
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelEditBtn">Cancel</button>
        <button class="btn-save"   id="saveEditBtn">Save</button>
      </div>
    </div>
  </div>

  <main class="card">

    <!-- Header -->
    <div class="header">
      <div class="logo-area">
        <div class="logo">Task<span>flow</span></div>
        <div class="subtitle">stay focused, ship things</div>
      </div>
      <div class="header-right">
        <button class="theme-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <div class="stats-grid">
          <div class="stat">
            <div class="stat-num" id="statTotal">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat">
            <div class="stat-num accent" id="statDone">0</div>
            <div class="stat-label">Done</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="progressLabel">No tasks yet</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Input section -->
    <div class="input-section">
      <div class="input-row">
        <input class="task-input" id="taskInput" placeholder="What needs to be done?" maxlength="120" autocomplete="off" />
        <button class="add-btn" id="addBtn" aria-label="Add task">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="input-meta">
        <div class="meta-row">
          <span class="meta-label">Tag</span>
          <div class="tag-chips">
            <button class="tag-chip" data-tag="work">Work</button>
            <button class="tag-chip" data-tag="personal">Personal</button>
            <button class="tag-chip" data-tag="urgent">Urgent</button>
          </div>
        </div>
        <div class="meta-row">
          <span class="meta-label">Priority</span>
          <div class="priority-chips">
            <button class="priority-chip high"   data-priority="high">🔴 High</button>
            <button class="priority-chip medium" data-priority="medium">🟡 Med</button>
            <button class="priority-chip low"    data-priority="low">🟢 Low</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
      <button class="filter-btn" data-filter="work">Work</button>
      <button class="filter-btn" data-filter="personal">Personal</button>
      <button class="filter-btn" data-filter="urgent">Urgent</button>
    </div>

    <!-- Task list -->
    <div class="list" id="list"></div>

    <!-- Footer -->
    <div class="footer" id="footer" style="display:none">
      <span class="footer-text" id="footerText"></span>
      <div class="footer-actions">
        <button class="ghost-btn" id="clearDoneBtn">Clear done</button>
      </div>
    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
